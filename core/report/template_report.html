<style>

.kicker,.section-kicker{color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.side-card h4{margin:8px 0 8px;font-size:23px;line-height:1.05;letter-spacing:-.035em}.side-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}

.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:34px;align-items:center}.hero h1{margin:10px 0 0;font-size:clamp(38px,4vw,62px);line-height:1.02;letter-spacing:-.055em}.hero h1 span{display:block;font-size:.52em;margin-top:10px;letter-spacing:.07em}.hero-sub{margin-top:16px;color:var(--muted);font-size:14px;letter-spacing:.04em;text-transform:uppercase}.hero-logo{width:100%;max-width:410px;justify-self:end;filter:drop-shadow(0 18px 34px rgba(121,168,255,.12))}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:900;cursor:pointer}.btn.print{background:var(--accent);color:#080808}.btn.ghost{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line)}

.section{margin-top:24px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:16px}.grid-4{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px}.two-panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.mt{margin-top:16px}

.metric-card.blue:before,.kpi.blue:before,.stat-tile.blue:before{background:linear-gradient(90deg,var(--blue),#b1ccff)}.metric-card.green:before,.kpi.green:before,.stat-tile.green:before{background:linear-gradient(90deg,var(--green),#8defb2)}.metric-card.accent:before,.kpi.accent:before,.stat-tile.accent:before{background:linear-gradient(90deg,var(--accent),var(--accent2))}.kpi.purple:before{background:linear-gradient(90deg,var(--purple),#d9c8ff)}
.metric-label,.kpi span,.stat-top span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.metric-value{font-size:48px;font-weight:950;letter-spacing:-.06em;margin:10px 0 0}.metric-card p,.panel-head p,.stat-tile p,.top-card p,.insight p,.callout p,.executive-note p,.direction p{color:var(--muted);font-size:14px;line-height:1.55}.metric-card p{margin:10px 0 0}.metric-card .delta{margin-top:12px}

.kpi{position:relative;overflow:hidden;padding:20px;min-width:0}.kpi strong{display:block;font-size:31px;letter-spacing:-.05em;margin:10px 0 0;word-break:break-word}.kpi em{display:inline-flex;margin-top:12px;color:var(--green);background:rgba(67,209,122,.12);border:1px solid rgba(67,209,122,.16);font-style:normal;font-weight:900;font-size:13px;padding:7px 10px;border-radius:999px;white-space:nowrap}.kpi em.neg{color:var(--red);background:rgba(255,91,91,.12);border-color:rgba(255,91,91,.18)}
.stat-tile{position:relative;overflow:hidden;padding:18px;min-width:0}.stat-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}.stat-top span{min-width:0;line-height:1.25}.stat-badge{justify-self:end;white-space:nowrap}.stat-tile strong{display:block;font-size:28px;letter-spacing:-.05em;margin-top:10px;word-break:break-word}.stat-tile p{margin:8px 0 0;font-size:13px;line-height:1.45}

.top-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.top-card{position:relative;overflow:hidden;padding:20px}.top-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:12px}.top-meta em{font-style:normal;border-radius:999px;padding:6px 9px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-weight:800}.top-thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;border:1px solid var(--line2);margin:0 0 14px;background:#111}.top-card h4{font-size:20px;margin:0 0 8px}.top-card p{min-height:68px}.mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mini-grid div{padding:12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line2)}.mini-grid span{display:block;color:var(--muted);font-size:12px}.mini-grid strong{display:block;margin-top:5px;font-size:17px}

.split-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:center}.donut{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;margin:auto;position:relative}.donut:after{content:"";position:absolute;width:132px;height:132px;border-radius:50%;background:var(--panel)}.donut strong{position:relative;z-index:1;font-size:52px;letter-spacing:-.06em}.donut.views{background:conic-gradient(var(--blue) 0 62.5%,var(--accent) 62.5% 100%)}.donut.eng{background:conic-gradient(var(--accent) 0 76.3%,var(--blue) 76.3% 100%)}

.audience-split-grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}.gender-pie-wrap{display:grid;justify-items:center;gap:14px}.gender-pie{width:220px;height:220px;border-radius:50%;background:conic-gradient(var(--blue) 0 88.8%, var(--purple) 88.8% 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.gender-legend{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}.g-item{padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025);text-align:center}.g-item strong{display:block;font-size:15px;margin-bottom:6px}.g-item span{display:block;font-size:30px;font-weight:900;letter-spacing:-.04em}.g-item small{display:block;margin-top:4px;color:var(--muted);font-size:13px}.g-item.male span{color:var(--blue)}.g-item.female span{color:var(--purple)}.age-chart{display:grid;gap:14px;margin-top:4px}.age-bar-row{display:grid;grid-template-columns:74px minmax(0,1fr) 60px;gap:12px;align-items:center}.age-bar-row .age-name{font-size:14px;color:var(--muted)}.age-bar-row .age-track{height:18px;border-radius:999px;background:rgba(255,255,255,.045);border:1px solid var(--line2);overflow:hidden}.age-bar-row .age-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg, rgba(121,168,255,.35), #62c7da)}.age-bar-row .age-num{text-align:right;font-size:14px;font-weight:800}.pie-caption{font-size:13px;color:var(--muted);text-align:center;max-width:280px;line-height:1.5}@media (max-width:1200px){.audience-split-grid{grid-template-columns:1fr}.two-panels{grid-template-columns:1fr}}

.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.mini-tiles .stat-tile strong{font-size:38px}
.mini-tiles .stat-tile p{min-height:auto}
.chart-surface{margin-top:16px;padding:14px;border-radius:20px;background:linear-gradient(180deg,#0b1118,#101721);border:1px solid rgba(255,255,255,.06);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.chart-surface.tight{margin-top:14px}
.chart-surface img{display:block;width:100%;height:auto;border-radius:14px;background:#f6f7fb}
.section-block .two-panels{gap:18px}
.top-thumb{width:100%;height:230px;object-fit:contain !important;object-position:center !important;background:#0b1016;padding:10px;border-radius:18px}
.top-card{align-content:start}
.top-card h4{margin-top:16px}
.geo-chart-note{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.5}
@media (max-width: 1200px){.grid-2{grid-template-columns:1fr}.section-block-head h3{font-size:26px}}


.section-block-head{display:grid !important;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"kicker metric" "title metric" "desc metric";align-items:end;column-gap:20px;row-gap:4px}
.section-block-head > .section-kicker{grid-area:kicker}
.section-block-head > h3{grid-area:title;margin:0 !important}
.section-block-head > p{grid-area:desc;margin:0 !important;max-width:900px}
.section-highlight{grid-area:metric;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px;padding:14px 18px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg, rgba(217,249,57,.08), rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.04);min-width:220px}
.section-highlight small{text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted);white-space:nowrap}
.section-highlight strong{font-size:54px;line-height:.9;letter-spacing:-.04em}
.section-highlight em{font-style:normal;font-size:18px;font-weight:800;color:var(--lime);white-space:nowrap}
.dual-stats{display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important;gap:16px !important}
.dual-stat span,.dual-stat strong,.dual-stat em{white-space:nowrap}
.top-thumb{width:100% !important;height:248px !important;object-fit:cover !important;object-position:center center !important;padding:0 !important;background:#0b1016 !important}
.chart-surface img{background:#f6f7fb !important}
.tiktok-portata-chart .chart-surface{margin-top:16px}
@media (max-width: 1200px){.section-block-head{grid-template-columns:1fr;grid-template-areas:"kicker" "title" "desc" "metric"}.section-highlight{align-items:flex-start;min-width:0}.dual-stats{grid-template-columns:1fr !important}.top-thumb{height:220px !important}}
</style>
</head>
<body>
<div class="app" id="top">
<aside class="sidebar" id="sidebar"></aside>
<main class="content" id="main"></main>
</div>
<a class="back-top" href="#top">↑ Torna su</a>
<script>

const DATA = {{DATA}};

/* ---------- helpers ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const has = v => v && (Array.isArray(v)?v.length>0:(typeof v==='object'?Object.keys(v).length>0:String(v).trim()!==''));
function parseNum(s){
  if(typeof s==='number') return s;
  if(s==null) return 0;
  let t=String(s).trim().toLowerCase().replace(/[^\d.,km-]/g,'');
  let mult=1;
  if(t.endsWith('m')){mult=1e6;t=t.slice(0,-1);}
  else if(t.endsWith('k')){mult=1e3;t=t.slice(0,-1);}
  // italiano: '.' migliaia, ',' decimali
  if(t.includes(',')) t=t.replace(/\./g,'').replace(',','.');
  else if((t.match(/\./g)||[]).length>1) t=t.replace(/\./g,'');
  const n=parseFloat(t);
  return isNaN(n)?0:n*mult;
}
function compact(n){
  n=Number(n)||0;
  const a=Math.abs(n);
  if(a>=1e6) return (n/1e6).toFixed(n%1e6?1:0).replace('.',',')+'M';
  if(a>=1e3) return (n/1e3).toFixed(a<1e4&&n%1e3?1:0).replace('.',',')+'K';
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}
function fmtInt(n){ return String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
const isPos = d => d && String(d).trim().startsWith('+');
const isNeg = d => d && String(d).trim().startsWith('-');
function deltaBadge(d){
  if(!d||d==='No data'||d==='—') return '';
  const cls = isNeg(d)?'neg':'';
  return `<em class="${cls}">${esc(d)}</em>`;
}
function statBadge(d,label){
  if(d && d!=='No data'){ const c=isNeg(d)?'negative':'positive'; return `<small class="stat-badge ${c}">${esc(d)}</small>`; }
  return label?`<small class="stat-badge blue">${esc(label)}</small>`:'';
}
function sentences(t){ return String(t||'').split(/(?<=[.!?…])\s+/).map(x=>x.trim()).filter(Boolean); }
function bullets(arr){ return (arr||[]).filter(has).map(x=>`<li>${esc(x)}</li>`).join(''); }

/* lookup KPI per id */
function kpi(ch,id){ return (ch.kpis||[]).find(k=>k.id===id) || null; }
function kval(ch,id){ const k=kpi(ch,id); return k?k.value:null; }
function kdelta(ch,id){ const k=kpi(ch,id); return k?k.delta:null; }
function knum(ch,id){ const k=kpi(ch,id); return k?parseNum(k.value):0; }

const META = DATA.meta||{};
const CH = DATA.channels||[];
const CORE = CH.filter(c=>String(c.type||'').toLowerCase()!=='tiktok');
const TIKTOK = CH.filter(c=>String(c.type||'').toLowerCase()==='tiktok');
const chLabel = c => c.label || (c.id||'Canale');
const CVAR = {instagram:'accent', facebook:'blue', linkedin:'blue', tiktok:'purple'};
const cvar = c => CVAR[String(c.type||'').toLowerCase()] || 'accent';

/* ---------- SIDEBAR ---------- */
function renderNav(){
  const items=[['intro','Cover'],['overview','Executive recap']];
  if(CORE.length>=2){ items.push(['split','Ripartizioni'],['compare','Confronto canali']); }
  CORE.forEach(c=>items.push([c.id, chLabel(c)]));
  TIKTOK.forEach(c=>items.push([c.id, chLabel(c)]));
  const nav=items.map((it,i)=>`<a href="#${it[0]}">${String(i+1).padStart(2,'0')}. ${esc(it[1])}</a>`).join('');
  return `<img alt="logo" class="side-logo" src="{{LOGO}}" onerror="this.style.display='none'"/>
  <div class="side-card"><span class="kicker">Client presentation</span><h4>Executive social report</h4></div>
  <nav class="nav">${nav}</nav>`;
}

/* ---------- HERO ---------- */
function renderHero(){
  const period=META.period||'';
  const chips=[period?`Periodo: ${esc(period)}`:'', 'Canali: '+CH.map(chLabel).join(' + '), 'Output: analisi + roadmap operativa'].filter(Boolean);
  return `<section class="hero" id="intro"><div class="hero-grid"><div>
    <span class="kicker">${esc(META.brand||'')}${period?' · '+esc(period):''}</span>
    <h1>${esc(META.brand||'Social Performance Report')}<span>${esc(period||'')}</span></h1>
    <div class="hero-sub">${CH.map(chLabel).join(' · ')} · Insights e considerazioni</div>
    <div class="hero-actions"><button class="btn print" onclick="window.print()">Stampa / Esporta PDF</button></div>
    <div class="hero-chips">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
  </div><img alt="logo" class="hero-logo" src="{{LOGO}}" onerror="this.style.display='none'"/></div></section>`;
}

/* ---------- OVERVIEW (aggregato core) ---------- */
function overviewCard(label,total,parts,cls){
  return `<article class="metric-card ${cls}"><div class="metric-label">${esc(label)}</div>
    <div class="metric-value">${compact(total)}</div><p>${parts.join(' · ')}</p></article>`;
}
function renderOverview(){
  if(!CORE.length) return '';
  const metrics=[['followers','Follower di presidio','green'],['engagement','Engagement totale','accent'],['views','Views complessive','blue']];
  const cards=metrics.map(m=>{
    // valori di canale VERBATIM dal file; solo il totale e' un aggregato derivato
    const parts=CORE.map(c=>`${esc(kval(c,m[0])!=null?kval(c,m[0]):'—')} ${chLabel(c)}`);
    const total=CORE.reduce((s,c)=>s+knum(c,m[0]),0);
    return overviewCard(m[1],total,parts,m[2]);
  }).join('');
  let exec='';
  const withExec=CORE.filter(c=>has((c.narrative||{}).hero) || has(c.exec));
  if(withExec.length){
    exec=`<section class="section two-panels">`+CORE.map(c=>{
      const t=(c.exec)||((c.narrative||{}).hero)||'';
      if(!has(t)) return '';
      return `<div class="panel executive-note"><span class="section-kicker">Executive insight</span><h3>${esc(chLabel(c))}</h3><p>${esc(t)}</p><div class="role-line"><span></span><span></span><span></span></div></div>`;
    }).join('')+`</section>`;
  }
  return `<section class="section grid-3" id="overview">${cards}</section>${exec}`;
}

/* ---------- RIPARTIZIONI (donut split) ---------- */
function donut(title,kicker,metricId,total){
  const segs=CORE.map((c,i)=>({label:chLabel(c),val:knum(c,metricId),disp:kval(c,metricId),color:['var(--blue)','var(--accent)','var(--green)','var(--purple)'][i%4]}))
                 .filter(s=>s.val>0).sort((a,b)=>b.val-a.val);
  const tot=segs.reduce((s,x)=>s+x.val,0)||1;
  let acc=0; const stops=segs.map(s=>{const a=acc, b=acc+s.val/tot*100; acc=b; return `${s.color} ${a.toFixed(1)}% ${b.toFixed(1)}%`;}).join(',');
  // valore di canale VERBATIM + percentuale (la % e' l'unico dato derivato della ripartizione)
  const legend=segs.map(s=>`<div class="legend-item"><span><i style="background:${s.color}"></i>${esc(s.label)}</span><strong>${esc(s.disp!=null?s.disp:compact(s.val))} · ${(s.val/tot*100).toFixed(1)}%</strong></div>`).join('');
  return `<div class="panel"><div class="panel-head"><div><span class="section-kicker">${esc(kicker)}</span><h3>${esc(title)}</h3><p>Distribuzione tra i canali di presidio.</p></div><span class="panel-badge"><span>${compact(tot)}</span><small>totale</small></span></div>
    <div class="split-grid"><div class="donut" style="background:conic-gradient(${stops})"><strong>${compact(tot)}</strong></div><div class="legend">${legend}</div></div></div>`;
}
function renderSplit(){
  if(CORE.length<2) return '';
  return `<section class="section two-panels" id="split">
    ${donut('Ripartizione views','Distribuzione','views')}
    ${donut('Ripartizione engagement','Distribuzione','engagement')}</section>`;
}

/* ---------- CONFRONTO CANALI ---------- */
function fmtPrevalente(c){ const m=(c.publishing_mix||[]).slice().sort((a,b)=>(b.posts||0)-(a.posts||0)); return m.length?m.slice(0,2).map(x=>x.format).join(' + '):'—'; }
function renderCompare(){
  if(CORE.length<2) return '';
  const rows=[
    ['Follower totali','followers'],['Engagement totale','engagement'],['Views','views'],
    ['Mentions','mentions'],['Contenuti pubblicati','published']
  ].filter(r=>CORE.some(c=>kpi(c,r[1])));
  const head=`<th>Indicatore</th>`+CORE.map(c=>`<th>${esc(chLabel(c))}</th>`).join('');
  const body=rows.map(r=>{
    const cells=CORE.map(c=>{const k=kpi(c,r[1]); if(!k) return '<td>—</td>'; const d=(k.delta&&k.delta!=='No data')?`<span class="delta ${isNeg(k.delta)?'neg':'pos'}">${esc(k.delta)}</span>`:''; return `<td>${esc(k.value)} ${d}</td>`;}).join('');
    return `<tr><td><strong>${esc(r[0])}</strong></td>${cells}</tr>`;
  }).join('');
  const fmtRow=`<tr><td><strong>Formato prevalente</strong></td>${CORE.map(c=>`<td>${esc(fmtPrevalente(c))}</td>`).join('')}</tr>`;
  return `<section class="section panel" id="compare"><div class="panel-head"><div><span class="section-kicker">Confronto canali</span><h3>${CORE.map(chLabel).join(' vs ')}</h3><p>Uno sguardo comparativo per leggere il ruolo dei canali nell'ecosistema social.</p></div></div>
    <div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}${fmtRow}</tbody></table></div></section>`;
}

/* ---------- blocchi sezione ---------- */
function sectionBlock(kicker,title,desc,highlight,inner){
  const hl=highlight?`<div class="section-highlight"><small>${esc(highlight.label)}</small><strong>${esc(highlight.value)}</strong>${highlight.delta?`<em>${esc(highlight.delta)}</em>`:''}</div>`:'';
  return `<div class="section-block mt"><div class="section-block-head"><span class="section-kicker">${esc(kicker)}</span><h3>${esc(title)}</h3><p>${esc(desc)}</p>${hl}</div>${inner}</div>`;
}
function barList(rows){
  const max=Math.max(...rows.map(r=>Math.abs(parseNum(r.value))),1);
  const colors=['blue','accent','green','orange','purple'];
  return `<div class="bar-list">`+rows.map((r,i)=>`<div class="bar-row"><div class="bar-copy"><span>${esc(r.label)}</span><strong>${esc(r.display!=null?r.display:fmtInt(parseNum(r.value)))}</strong></div><div class="bar-track"><div class="bar-fill ${r.color||colors[i%colors.length]}" style="width:${(Math.abs(parseNum(r.value))/max*100).toFixed(1)}%"></div></div></div>`).join('')+`</div>`;
}

/* AUDIENCE growth */
function audienceBlock(ch){
  const ag=ch.audience_growth||ch.follower_growth||[];
  const get=lab=>{const r=ag.find(a=>new RegExp(lab,'i').test(a.label||'')); return r?r.value:null;};
  const nuovi=get('nuov'), persi=get('pers'), netta=get('nett');
  const foll=kval(ch,'followers');
  if(foll==null && !ag.length) return '';
  const tiles=[];
  if(foll!=null) tiles.push(`<div class="stat-tile blue"><div class="stat-top"><span>Follower totali</span><small class="stat-badge blue">Base attuale</small></div><strong>${esc(foll)}</strong><p>Community ${esc(chLabel(ch))} del canale.</p></div>`);
  if(netta!=null) tiles.push(`<div class="stat-tile green"><div class="stat-top"><span>Crescita netta</span><small class="stat-badge positive">Saldo mese</small></div><strong>${netta>=0?'+':''}${fmtInt(netta)}</strong><p>Differenza tra nuovi follower e follower persi.</p></div>`);
  if(nuovi!=null) tiles.push(`<div class="stat-tile accent"><div class="stat-top"><span>Nuovi follower</span><small class="stat-badge accent">Acquisizione</small></div><strong>${fmtInt(nuovi)}</strong><p>Spinta sul presidio audience del canale.</p></div>`);
  if(persi!=null) tiles.push(`<div class="stat-tile orange"><div class="stat-top"><span>Follower persi</span><small class="stat-badge orange">Churn</small></div><strong>${fmtInt(persi)}</strong><p>Livello di abbandono rispetto alla crescita.</p></div>`);
  if(!tiles.length) return '';
  const inner=`<div class="panel"><div class="panel-head"><div><span class="section-kicker">Audience</span><h3>Audience growth</h3><p>Snapshot della crescita follower nel mese.</p></div></div><div class="grid-2 mini-tiles" style="grid-template-columns:repeat(${Math.min(tiles.length,4)},minmax(0,1fr))">${tiles.join('')}</div></div>`;
  return sectionBlock('Sezione','Audience','Crescita della base follower e saldo netto del mese.', netta!=null?{label:'Net growth',value:(netta>=0?'+':'')+fmtInt(netta)}:null, `<div class="section-row">${inner}</div>`);
}

/* ENGAGEMENT */
function engagementBlock(ch){
  const eb=ch.engagement_breakdown||[]; const rates=ch.rates||[];
  if(!eb.length && !rates.length) return '';
  const engTot=kval(ch,'engagement'); const engDelta=kdelta(ch,'engagement');
  let ratePanel='';
  if(rates.length){
    const tiles=[`<div class="stat-tile green"><div class="stat-top"><span>Engagement totale</span>${statBadge(engDelta)}</div><strong>${esc(engTot||'')}</strong><p>Somma delle interazioni generate nel mese.</p></div>`]
      .concat(rates.slice(0,2).map((r,i)=>`<div class="stat-tile ${i?'accent':'blue'}"><div class="stat-top"><span>${esc(r.metric.replace('Engagement rate','ER'))}</span>${statBadge(r.variation)}</div><strong>${esc(r.total)}</strong><p>Organico ${esc(r.organic)} · Paid ${esc(r.paid)}.</p></div>`));
    ratePanel=`<div class="panel"><div class="panel-head"><div><span class="section-kicker">Engagement</span><h3>Engagement rate</h3><p>Qualità dell'interazione tra organico, paid e reach.</p></div></div><div class="grid-3">${tiles.join('')}</div></div>`;
  }
  let compPanel='';
  if(eb.length){
    const rows=eb.filter(e=>e.total!=null).map(e=>({label:e.label,value:e.total}));
    const org=eb.reduce((s,e)=>s+(Number(e.organic)||0),0), paid=eb.reduce((s,e)=>s+(Number(e.paid)||0),0), tot=eb.reduce((s,e)=>s+(Number(e.total)||0),0);
    const note=`<div class="note-pill">Engagement organico: ${fmtInt(org)} · paid: ${fmtInt(paid)} · totale: ${fmtInt(tot)}</div>`;
    compPanel=`<div class="panel"><div class="panel-head"><div><span class="section-kicker">Engagement</span><h3>Composizione engagement</h3><p>Come si distribuiscono le interazioni generate dal canale.</p></div></div>${barList(rows)}${note}</div>`;
  }
  const inner = ratePanel&&compPanel ? `<div class="two-panels section-row">${ratePanel}${compPanel}</div>` : `<div class="section-row">${ratePanel}${compPanel}</div>`;
  return sectionBlock('Sezione','Engagement','Interazione, qualità della risposta e composizione delle interazioni.', engTot?{label:'Engagement totale',value:engTot,delta:(engDelta&&engDelta!=='No data')?engDelta:''}:null, inner);
}

/* VIEWS distribution */
function viewsBlock(ch){
  const sv=(ch.split&&ch.split.views)||[];
  const org=kval(ch,'organic_views'), paid=kval(ch,'paid_views'), tot=kval(ch,'views');
  if(!sv.length && org==null && paid==null) return '';
  let rows=sv.length?sv.map(x=>({label:x.label,value:x.value,display:x.display})):[];
  if(!rows.length){ if(org!=null) rows.push({label:'Organic views',value:parseNum(org),display:org}); if(paid!=null) rows.push({label:'Paid views',value:parseNum(paid),display:paid}); }
  const duals=rows.map((r,i)=>`<div class="dual-stat ${i?'blue':'green'}"><span>${esc(r.label)}</span><strong>${esc(r.display!=null?r.display:compact(r.value))}</strong></div>`).join('');
  const inner=`<div class="section-row"><div class="panel"><div class="panel-head"><div><span class="section-kicker">Views</span><h3>Distribuzione views</h3><p>Ripartizione tra views organiche e paid.</p></div></div>${barList(rows)}<div class="dual-stats">${duals}</div></div></div>`;
  return sectionBlock('Sezione','Distribuzione views','Peso di organic views e paid views.', tot?{label:'Views totali',value:tot,delta:(kdelta(ch,'views')||'')!=='No data'?kdelta(ch,'views'):''}:null, inner);
}

/* CONTENUTI: publishing + format mix + timing */
function contentBlock(ch){
  const pm=ch.publishing_mix||[]; const pub=kval(ch,'published');
  if(!pm.length && pub==null) return '';
  const stats=[];
  if(pub!=null) stats.push(`<div class="stat-tile blue"><div class="stat-top"><span>Post pubblicati</span>${statBadge(kdelta(ch,'published'))}</div><strong>${esc(pub)}</strong><p>Volume produttivo del canale nel mese.</p></div>`);
  if(kval(ch,'post_views')!=null) stats.push(`<div class="stat-tile green"><div class="stat-top"><span>Views dei post</span>${statBadge(kdelta(ch,'post_views'))}</div><strong>${esc(kval(ch,'post_views'))}</strong><p>Visualizzazioni generate dai contenuti.</p></div>`);
  if(kval(ch,'post_engagement')!=null) stats.push(`<div class="stat-tile orange"><div class="stat-top"><span>Engagement dei post</span>${statBadge(kdelta(ch,'post_engagement'))}</div><strong>${esc(kval(ch,'post_engagement'))}</strong><p>Interazioni generate dai contenuti.</p></div>`);
  const pubPanel=stats.length?`<div class="panel"><div class="panel-head"><div><span class="section-kicker">Contenuti</span><h3>Publishing performance</h3><p>Volume e performance dei contenuti pubblicati.</p></div></div><div class="grid-3 content-stats">${stats.join('')}</div></div>`:'';
  let mixPanel='';
  if(pm.length){
    const rows=pm.map(m=>({label:m.format,value:m.posts}));
    mixPanel=`<div class="panel"><div class="panel-head"><div><span class="section-kicker">Format</span><h3>Mix format</h3><p>Distribuzione dei formati pubblicati nel mese.</p></div></div>${barList(rows)}</div>`;
  }
  let timePanel='';
  const tm=ch.timing||[];
  if(tm.length){
    timePanel=`<div class="panel"><div class="panel-head"><div><span class="section-kicker">Timing</span><h3>Best day &amp; time</h3><p>Momenti consigliati per la pubblicazione.</p></div></div><div class="insight-list">${tm.map(t=>`<div class="insight"><strong>${esc(t.label||t.slot||'Slot')}</strong><p>${esc(t.note||t.value||t.slot||'')}</p></div>`).join('')}</div></div>`;
  }
  const bottom = (mixPanel&&timePanel)?`<div class="two-panels section-row">${mixPanel}${timePanel}</div>`:(mixPanel||timePanel?`<div class="section-row">${mixPanel}${timePanel}</div>`:'');
  return sectionBlock('Sezione','Contenuti','Publishing performance e mix dei formati pubblicati.', null, pubPanel+bottom);
}

/* TOP CONTENT (con thumbnail opzionale) */
function topBlock(ch){
  const tc=ch.top_content||ch.top_post||[]; if(!tc.length) return '';
  const cards=tc.slice(0,3).map(t=>{
    const thumb=t.thumb?`<img alt="${esc(t.topic||'')}" class="top-thumb" src="${t.thumb}"/>`:'';
    const metrics=[['Views',t.views],['Reach',t.reach],['Engagement',t.engagement],['ER reach',t.er_reach!=null?t.er_reach+'%':null]].filter(m=>m[1]!=null&&m[1]!=='');
    const grid=metrics.map(m=>`<div><span>${esc(m[0])}</span><strong>${esc(typeof m[1]==='number'?fmtInt(m[1]):m[1])}</strong></div>`).join('');
    return `<article class="top-card"><div class="top-meta"><span>${esc((t.date||'')+(t.time?' · '+t.time:''))}</span><em>${esc(t.type||'Post')}</em></div>${thumb}<h4>${esc(t.topic||'Contenuto')}</h4><p>${esc(t.description||t.insight||'')}</p><div class="mini-grid">${grid}</div></article>`;
  }).join('');
  return `<div class="panel mt"><div class="panel-head"><div><span class="section-kicker">Top content</span><h3>Contenuti migliori</h3><p>I contenuti con il miglior rendimento nel mese.</p></div><span class="panel-badge">Top performance</span></div><div class="top-grid">${cards}</div></div>`;
}

/* GEO / DEMOGRAFICA */
function geoBlock(ch){
  const geo=ch.geo||[]; const dem=ch.demographics||null; const ins=[];
  if(geo.length) ins.push(`<div class="insight"><strong>Città principali</strong><p>${esc(geo.slice(0,6).map(g=>g.city).join(', '))}</p></div>`);
  if(dem&&dem.note) ins.push(`<div class="insight"><strong>Demografica</strong><p>${esc(dem.note)}</p></div>`);
  if(!ins.length) return '';
  const inner=`<div class="section-row"><div class="panel"><div class="panel-head"><div><span class="section-kicker">Audience</span><h3>Geo-audience e demografica</h3><p>Principali concentrazioni geografiche del pubblico.</p></div></div><div class="insight-list">${ins.join('')}</div></div></div>`;
  return sectionBlock('Sezione','Audience','Approfondimento sulla distribuzione geografica del pubblico.', null, inner);
}

/* DECISION ROOM */
function decisionRoom(ch){
  const N=ch.narrative||{}; const cons=N.considerazioni||{}; const concl=N.conclusioni||{}; const rm=ch.roadmap||{};
  const generali = (Array.isArray(cons.generale)&&cons.generale.length)?cons.generale : sentences(cons.performance);
  const forza = sentences(cons.forza);
  const attenzione = sentences(cons.attenzione);
  const passi = [].concat(rm.continuare||[], rm.potenziare||[], rm.testare||[]).slice(0,4);
  const dir = (Array.isArray(concl.direzione)&&concl.direzione.length)? (concl.direzione[0].desc||concl.direzione[0].title||'') : cons.sintesi||'';
  if(!generali.length && !forza.length && !attenzione.length && !passi.length && !has(dir)) return '';
  const card=(cls,n,title,items)=> items.length?`<article class="decision-card ${cls}"><span>${n}</span><h4>${esc(title)}</h4><ul>${bullets(items)}</ul></article>`:'';
  const grid=[card('general','01','Considerazioni generali',generali),card('strength','02','Punti di forza',forza),card('alert','03','Punti di attenzione',attenzione),card('roadmap','04','Prossimi passi · Roadmap',passi)].filter(Boolean).join('');
  const direzione=has(dir)?`<div class="direction"><strong>Direzione consigliata</strong><p>${esc(dir)}</p></div>`:'';
  return `<section class="decision-room"><div class="decision-title"><div><span class="section-kicker">Decision room</span><h3>Considerazioni e conclusioni</h3><p>Una lettura finale per trasformare i dati in indicazioni operative.</p></div></div><div class="decision-grid">${grid}</div>${direzione}</section>`;
}

/* CHAPTER per canale */
function renderChapter(ch,idx){
  const head=`<div class="chapter-head"><span>${String(idx).padStart(2,'0')}</span><div><em>${esc(ch.type==='tiktok'?'Profilo TikTok':chLabel(ch))}</em><h2>${esc(chLabel(ch))}</h2><p>${esc((ch.exec)||((ch.narrative||{}).hero)||'')}</p></div></div>`;
  const k4=['followers','engagement','views','mentions'].map(id=>kpi(ch,id)).filter(Boolean);
  const kg=k4.length?`<div class="panel"><div class="panel-head"><div><span class="section-kicker">KPI principali</span><h3>Performance overview</h3><p>Le metriche chiave del canale nel periodo.</p></div></div><div class="grid-4">${k4.map((k,i)=>`<div class="kpi ${['blue','green','accent','purple'][i%4]}"><span>${esc(k.label)}</span><strong>${esc(k.value)}</strong>${deltaBadge(k.delta)}</div>`).join('')}</div></div>`:'';
  return `<section class="chapter" id="${ch.id}">${head}${kg}${audienceBlock(ch)}${engagementBlock(ch)}${viewsBlock(ch)}${contentBlock(ch)}${topBlock(ch)}${geoBlock(ch)}${decisionRoom(ch)}</section>`;
}

/* ---------- MOUNT ---------- */
document.getElementById('sidebar').innerHTML=renderNav();
let idx=0;
const main=[renderHero(),renderOverview(),renderSplit(),renderCompare()];
CORE.forEach(c=>main.push(renderChapter(c,++idx)));
TIKTOK.forEach(c=>main.push(renderChapter(c,++idx)));
main.push(`<div class="footer">${esc(META.brand||'')} · Social Performance Report${META.period?' · '+esc(META.period):''}</div>`);
document.getElementById('main').innerHTML=main.join('');

/* scrollspy */
const links=document.querySelectorAll('.nav a');
const secs=[...links].map(l=>document.querySelector(l.getAttribute('href'))).filter(Boolean);
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.remove('active'));const a=document.querySelector(`.nav a[href="#${e.target.id}"]`);if(a)a.classList.add('active');}}),{threshold:.2});
secs.forEach(s=>obs.observe(s));

</script>
